<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Roamly trip overview interface preview</title>
<desc id="desc">A designed preview of the Roamly travel planner showing a Lisbon trip, itinerary highlights, trip budget and destinations.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183d49"/><stop offset=".55" stop-color="#427b78"/><stop offset="1" stop-color="#d89464"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#294343" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="920" rx="38" fill="#f6f8f5"/>
<text x="100" y="100" fill="#246d6b" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">ROAMLY · GO SOMEWHERE GOOD</text>
<text x="100" y="162" fill="#1d3335" font-family="Arial,sans-serif" font-size="38" font-weight="700">Make room for the good bits.</text>
<text x="100" y="197" fill="#78888a" font-family="Arial,sans-serif" font-size="17">Trips, plans, budgets and packing — together in one calm place.</text>
